[package]
name = "wasm-image-pro"
version = "0.1.5"
edition = "2024"
description = "WebAssembly image processing library"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
image = "0.24"
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
rusttype = "0.9"
tract-onnx = "0.20"
ndarray = "0.15"