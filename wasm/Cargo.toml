[package]
name = "wasm-image-pro"
version = "0.1.6"
edition = "2024"
description = "WebAssembly image processing library"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.24", features = ["png", "jpeg"] }
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
rusttype = "0.9"
tract-onnx = "0.20"
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
lazy_static = "1.4"

[features]
default = ["image"]
image = []
