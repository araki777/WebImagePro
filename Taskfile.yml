version: 3

tasks:
  build:wasm:
    desc: "Rust AssemblyをビルドしてNext.jsに展開"
    cmds:
      - cd wasm && wasm-pack build --target web --out-dir ../public/wasm
    sources:
      - wasm/src/**
    generates:
      - wasm/**

build:
  desc: "WasmをビルドしてNext.jsをビルド"
  cmds:
    - tasks: build:wasm
    - cd next && npm run build

dev:
  desc: "WasmをビルドしてビルドしてNext.jsを開発サーバーを起動"
  cmds:
    - tasks: build:wasm
    - cd next && npm run dev
