name: Publish WASM Package

on:
  push:
    branches:
      - main
    paths:
      - "wasm/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get current version
        id: check
        run: |
          CURRENT_VERSION=$(grep '^version = ' wasm/Cargo.toml | cut -d '"' -f2)
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

          # npmjsレジストリで既存のバージョンをチェック
          if ! npm view "@araki777/wasm-image-pro@${CURRENT_VERSION}" version &> /dev/null; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  build_and_publish:
    needs: check_version
    if: needs.check_version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          profile: minimal
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd wasm
          # 現在のディレクトリ構造を確認
          echo "Current directory structure:"
          ls -la

          # Cargo.tomlの内容を確認
          echo "Cargo.toml contents:"
          cat Cargo.toml

          # ビルドコマンドの実行（詳細なログを出力）
          echo "Building WASM..."
          RUST_BACKTRACE=1 wasm-pack build --target web --release --verbose

          # ビルド後のディレクトリ構造を確認
          echo "Directory structure after build:"
          ls -la

          # pkgディレクトリの存在を確認
          if [ ! -d "pkg" ]; then
            echo "Error: pkg directory not found after build"
            echo "Build artifacts:"
            ls -la target/wasm32-unknown-unknown/release/
            exit 1
          fi

          echo "Build artifacts in pkg directory:"
          ls -la pkg/

      - name: Create package.json
        run: |
          # pkgディレクトリの存在を確認
          if [ ! -d "wasm/pkg" ]; then
            echo "Error: wasm/pkg directory not found"
            exit 1
          fi
          cat > package.json << EOF
          {
            "name": "@araki777/wasm-image-pro",
            "version": "${{ needs.check_version.outputs.current_version }}",
            "description": "WebAssembly image processing package",
            "main": "wasm/pkg/wasm_image_pro.js",
            "types": "wasm/pkg/wasm_image_pro.d.ts",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "files": [
              "wasm/pkg"
            ],
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            }
          }
          EOF

      - name: Verify package contents
        run: |
          # 必要なファイルの存在を確認
          if [ ! -f "wasm/pkg/wasm_image_pro.js" ] || [ ! -f "wasm/pkg/wasm_image_pro.d.ts" ]; then
            echo "Error: Required WASM files not found"
            echo "Contents of wasm/pkg:"
            ls -la wasm/pkg/
            exit 1
          fi
          ls -la wasm/pkg/

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
