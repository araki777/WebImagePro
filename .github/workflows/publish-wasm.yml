name: Publish WASM Package

on:
  push:
    branches:
      - develop
    paths:
      - "wasm/src/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      current_version: ${{ steps.check.outputs.current_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get current version
        id: check
        run: |
          CURRENT_VERSION=$(grep '^version = ' wasm/Cargo.toml | cut -d '"' -f2)
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

          if ! npm view "@araki777/wasm-image-pro@${CURRENT_VERSION}" version &> /dev/null; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  build_and_publish:
    needs: check_version
    if: needs.check_version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          profile: minimal
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd wasm
          wasm-pack build --target web --release

      - name: Copy README for npm package
        run: cp wasm/README.md wasm/pkg/README.md

      - name: Create package.json
        run: |
          cd wasm/pkg
          cat > package.json << EOF
          {
            "name": "@araki777/wasm-image-pro",
            "version": "${{ needs.check_version.outputs.current_version }}",
            "description": "WebAssembly image processing package",
            "main": "wasm_image_pro.js",
            "types": "wasm_image_pro.d.ts",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "files": [
              "wasm_image_pro.js",
              "wasm_image_pro.d.ts",
              "wasm_image_pro_bg.wasm",
              "wasm_image_pro_bg.wasm.d.ts"
            ],
            "publishConfig": {
              "registry": "https://npm.pkg.github.com"
            }
          }
          EOF

      - name: Login to npm
        run: |
          cd wasm/pkg
          echo "//npm.pkg.github.com/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "@araki777:registry=https://npm.pkg.github.com" >> .npmrc
          npm login --registry=https://npm.pkg.github.com --scope=@araki777
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          cd wasm/pkg
          npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
