name: Update Labels on File Change

on:
  push:
    branches:
      - develop
    paths:
      - ".github/labels.json"

jobs:
  update-labels:
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: update label
        run: npx --yes @azu/github-label-setup --token ${{ secrets.GITHUB_TOKEN }} --labels .github/labels.json
